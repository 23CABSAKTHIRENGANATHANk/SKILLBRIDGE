services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: skillbridge_test
      POSTGRES_PASSWORD: skillbridge_test_password
      POSTGRES_DB: skillbridge_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge_test -d skillbridge_test"]
      interval: 2s
      timeout: 5s
      retries: 30
