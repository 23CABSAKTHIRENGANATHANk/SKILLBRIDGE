# ========================================================================
# SkillBridge Production Nginx Server Configuration
# ========================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name skillbridge.dev www.skillbridge.dev;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillbridge.dev www.skillbridge.dev;

    # SSL Certificates (Let's Encrypt / Cloudflare)
    ssl_certificate /etc/letsencrypt/live/skillbridge.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillbridge.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root for Frontend SPA Build
    root /var/www/skillbridge/dist;
    index index.html;

    # Max Upload Size (Resumes & Logos)
    client_max_body_size 12M;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.skillbridge.dev; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Block sensitive files and hidden paths
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Block direct access to backend storage & config
    location ^~ /backend/storage/ {
        deny all;
        return 403;
    }

    location ^~ /backend/config/ {
        deny all;
        return 403;
    }

    # Static Assets Cache (Vite hashed bundles)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Requests -> PHP REST Backend
    location ^~ /api/ {
        root /var/www/skillbridge;
        try_files $uri /backend/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/skillbridge/backend/index.php;
            fastcgi_param APP_ENV "production";
            fastcgi_read_timeout 60;
        }
    }

    # Frontend SPA Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
