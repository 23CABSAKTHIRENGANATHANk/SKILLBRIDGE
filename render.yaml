# ========================================================================
# SkillBridge Render Blueprint Configuration
# Deploys the PHP REST API Container as a Web Service
# ========================================================================

services:
  - type: web
    name: skillbridge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NOMINATIM_USER_AGENT
        value: SkillBridge/1.0 admin@skillbridge.dev
      - key: UPLOAD_MAX_SIZE
        value: "5242880"
